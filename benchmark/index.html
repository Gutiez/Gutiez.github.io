<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark 5K</title>
<meta name="description" content="Benchmark en el que cada modelo de IA invierte 5.000 dólares reales durante un año. AI models invest $5,000 for one year.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="./">Benchmark 5K <span data-i18n="brandSub"></span></a>
    <nav>
      <a href="./" aria-current="page" data-i18n="navBoard"></a>
      <a href="normas.html" data-i18n="navRules"></a>
      <select id="lang" aria-label="Idioma / Language"></select>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 data-i18n="heroH1"></h1>
    <p data-i18n="heroP"></p>
    <div class="banner" id="demo-banner" hidden data-i18n="demo"></div>
  </section>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <h2 data-i18n="chartH"></h2>
    <p class="desc" data-i18n="chartP"></p>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart" dir="ltr"><div class="tooltip" id="tooltip"></div></div>
  </section>

  <section class="card">
    <h2 data-i18n="boardH"></h2>
    <p class="desc" id="updated"></p>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>#</th><th data-i18n="thModel"></th><th data-i18n="thStatus"></th><th data-i18n="thDay"></th><th data-i18n="thValue"></th>
            <th data-i18n="thResult"></th><th>%</th><th data-i18n="thFees"></th><th data-i18n="thDd"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="tradesH"></h2>
    <p class="desc" style="margin-bottom:0" data-i18n="tradesP"></p>
  </section>

  <section class="card">
    <h2 data-i18n="howH"></h2>
    <p class="desc" data-i18n="howP"></p>
    <ul class="steps">
      <li><b data-i18n="s1b"></b><span data-i18n="s1t"></span></li>
      <li><b data-i18n="s2b"></b><span data-i18n="s2t"></span></li>
      <li><b data-i18n="s3b"></b><span data-i18n="s3t"></span></li>
      <li><b data-i18n="s4b"></b><span data-i18n="s4t"></span></li>
    </ul>
  </section>

  <footer data-i18n="footer"></footer>
</main>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
